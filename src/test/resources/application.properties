# Test-only settings: an in-memory database recreated for each test run, and a
# throwaway JWT secret (long enough to pass JwtSecretValidator, never used outside tests).
spring.datasource.url=jdbc:h2:mem:udhr_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=test-only-secret-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJ
jwt.expiration=1800000
jwt.refresh-expiration=604800000
