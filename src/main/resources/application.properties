# Server configuration
server.port=8085

# Database Configuration
# Override these via environment variables in any shared/production environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/udhr_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
# SQL logging can expose patient data into logs -- keep it off unless explicitly enabled locally.
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT Security Configuration
# Required: set JWT_SECRET to a long random value (e.g. `openssl rand -base64 32`).
# There is no default -- the application refuses to start without it. See README.md.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# CORS: comma-separated list of allowed frontend origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
