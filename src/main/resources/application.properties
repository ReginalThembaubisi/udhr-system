# Server configuration
# Render (and most PaaS hosts) inject their own PORT env var; falls back to
# 8085 for local dev where nothing sets that variable.
server.port=${PORT:8085}

# Database Configuration
# Overridden in production via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
# env vars (Spring Boot's relaxed binding maps these automatically); these
# defaults are only used for local dev against XAMPP/Docker MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/udhr_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Don't let the Postgres driver keep server-side prepared statements. With a
# pooled Postgres (e.g. Neon's pooler) a cached plan outlives a schema change:
# when Hibernate added new columns to "patients" on deploy, startup failed with
# "cached plan must not change result type". MySQL's driver ignores this.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Security Configuration
# No fallback value: the app refuses to start without a real JWT_SECRET. A
# default committed here would let anyone who reads this public repository
# mint a valid token for any role, so a missing secret must be a hard failure
# rather than a silent downgrade. Generate one with:
#   openssl rand -base64 48
# Empty default rather than none, so a missing secret is caught by
# JwtSecretValidator with a clear explanation instead of an unresolved-placeholder
# stack trace.
jwt.secret=${JWT_SECRET:}

# Access tokens are deliberately short-lived (30 minutes). A stolen token is
# only useful inside that window, and the refresh token below keeps users
# signed in without widening it.
jwt.expiration=1800000

# Refresh tokens last one 12-hour shift (not 7 days: clinic computers are
# shared) and are rotated on every use, so a stolen refresh token stops working
# as soon as the real user refreshes.
jwt.refresh-expiration=43200000

# Demo logins (ADMIN001/Admin@123 and the rest) are published in the code, so
# they are switched off unless DEMO_ACCOUNTS=enabled. Only enable it on a demo
# that holds made-up data, never once real patients are in the system.
udhr.demo-accounts=${DEMO_ACCOUNTS:disabled}
