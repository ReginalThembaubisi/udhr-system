# Server configuration
server.port=8085

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/udhr_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Security Configuration
jwt.secret=${JWT_SECRET:udhr-secret-key-2026-university-mpumalanga}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (comma-separated allowed origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
